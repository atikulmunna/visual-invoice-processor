name: Deploy Private Alpha to AWS

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "config/**"
      - "schemas/**"
      - "migrations/**"
      - "Dockerfile"
      - "requirements-serverless.txt"
      - "template.yaml"
      - ".github/workflows/deploy-aws.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: invoice-processor-alpha-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - uses: aws-actions/setup-sam@v2

      - name: Validate infrastructure
        run: sam validate --lint

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Build Lambda images
        run: sam build

      - name: Deploy stack
        shell: bash
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          sam deploy \
            --stack-name invoice-processor-alpha \
            --region ap-southeast-1 \
            --s3-bucket "invoice-processor-alpha-deploy-${account_id}-ap-southeast-1" \
            --image-repositories \
              "WebFunction=${account_id}.dkr.ecr.ap-southeast-1.amazonaws.com/invoice-processor-alpha-web" \
              "WorkerFunction=${account_id}.dkr.ecr.ap-southeast-1.amazonaws.com/invoice-processor-alpha-worker" \
            --role-arn "arn:aws:iam::${account_id}:role/invoice-processor-alpha-cloudformation-execution" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              PostgresParameterName=${{ vars.POSTGRES_PARAMETER_NAME }} \
              MistralParameterName=${{ vars.MISTRAL_PARAMETER_NAME }} \
              BudgetAlertEmail=${{ vars.BUDGET_ALERT_EMAIL }}

      - name: Smoke test health endpoint
        shell: bash
        run: |
          url=$(aws cloudformation describe-stacks --stack-name invoice-processor-alpha --query "Stacks[0].Outputs[?OutputKey=='DashboardUrl'].OutputValue" --output text)
          curl --fail --silent --show-error "${url}health"
