name: Deploy Private Alpha to AWS

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "config/**"
      - "schemas/**"
      - "migrations/**"
      - "Dockerfile"
      - "requirements-serverless.txt"
      - "template.yaml"
      - ".github/workflows/deploy-aws.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: invoice-processor-alpha-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - uses: aws-actions/setup-sam@v2

      - name: Validate infrastructure
        run: sam validate --lint

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Build Lambda images
        run: sam build

      - name: Deploy stack
        run: >-
          sam deploy
          --stack-name invoice-processor-alpha
          --region ap-southeast-1
          --resolve-image-repos
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          PostgresParameterName=${{ vars.POSTGRES_PARAMETER_NAME }}
          MistralParameterName=${{ vars.MISTRAL_PARAMETER_NAME }}
          BudgetAlertEmail=${{ vars.BUDGET_ALERT_EMAIL }}

      - name: Smoke test health endpoint
        shell: bash
        run: |
          url=$(aws cloudformation describe-stacks --stack-name invoice-processor-alpha --query "Stacks[0].Outputs[?OutputKey=='DashboardUrl'].OutputValue" --output text)
          curl --fail --silent --show-error "${url}health"

      - name: Retain only two Lambda images
        shell: bash
        run: |
          repositories=$(aws ecr describe-repositories --query "repositories[?contains(repositoryName, 'invoice-processor-alpha')].repositoryName" --output text)
          for repository in ${repositories}; do
            aws ecr put-lifecycle-policy --repository-name "${repository}" --lifecycle-policy-text file://infra/ecr-lifecycle.json
          done
