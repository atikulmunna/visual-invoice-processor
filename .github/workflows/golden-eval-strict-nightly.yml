name: Golden Set Strict Weekly

on:
  workflow_dispatch:
  schedule:
    # Weekly is enough to catch model drift; code changes already run the standard gate.
    - cron: "15 2 * * 1"

jobs:
  evaluate-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: golden-eval-strict-nightly
      cancel-in-progress: false
    env:
      LOG_LEVEL: INFO
      NORMALIZATION_RULES_PATH: config/normalization_rules.json
      OPENROUTER_MODEL: google/gemini-2.5-flash-lite
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY secret is required for strict weekly evaluation."
            exit 1
          fi

      - name: Run strict golden-set evaluation
        run: |
          python -u -m app.evaluation \
            --dataset eval/golden_set_strict.json \
            --model auto \
            --fail-under 0.75 \
            --output logs/golden_eval_strict_report.json

      - name: Upload strict evaluation report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-strict-report
          path: logs/golden_eval_strict_report.json
