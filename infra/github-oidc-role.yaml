AWSTemplateFormatVersion: "2010-09-09"
Description: One-time bootstrap for the invoice processor GitHub deployment role

Parameters:
  GitHubOwner:
    Type: String
  GitHubRepository:
    Type: String

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: invoice-processor-alpha-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepository}:*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: ManageInvoiceProcessorRolesAndBudget
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: arn:aws:iam::*:role/invoice-processor-alpha-*
              - Effect: Allow
                Action:
                  - budgets:CreateBudget
                  - budgets:ModifyBudget
                  - budgets:DeleteBudget
                  - budgets:ViewBudget
                Resource: "*"

Outputs:
  DeploymentRoleArn:
    Value: !GetAtt DeploymentRole.Arn
